<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>好き車9選</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>


<div class="app">


    <!-- =========================================
         ヘッダー
    ========================================== -->

    <header class="main-header">

        <div class="header-title">
            好き車9選
        </div>

        <div
            id="stage-description"
            class="header-subtitle"
        >
            一次選考
        </div>

    </header>



    <main class="app-main">


        <!-- =====================================
             一次選考
        ====================================== -->

        <section
            id="selection-screen"
            class="screen"
        >

            <div class="screen-top">

                <div class="stage-title-row">

                    <div>

                        <h2>
                            一次選考
                        </h2>

                        <p>
                            好きな車を好きなだけ選択
                        </p>

                    </div>


                    <button
                        id="show-selected-button"
                        type="button"
                        class="selected-count-button"
                    >

                        選択中

                        <strong id="selected-count">
                            0
                        </strong>

                        台

                    </button>

                </div>


                <div class="progress">

                    <div
                        id="selection-progress-bar"
                        class="progress-bar"
                    ></div>

                </div>

            </div>



            <div
                id="selection-grid"
                class="selection-grid"
            ></div>



            <div class="screen-bottom selection-bottom">

                <button
                    id="previous-button"
                    type="button"
                    class="nav-button secondary-button"
                >
                    ← 戻る
                </button>


                <div
                    id="selection-page"
                    class="page-number"
                >
                    1 / 1
                </div>


                <button
                    id="next-button"
                    type="button"
                    class="nav-button primary-button"
                >
                    次へ →
                </button>

            </div>

        </section>



        <!-- =====================================
             一次選考完了
        ====================================== -->

        <section
            id="selection-complete-screen"
            class="screen hidden"
        >

            <div class="complete-screen">

                <div class="complete-icon">
                    ✓
                </div>


                <h2>
                    一次選考完了
                </h2>


                <p class="complete-count">

                    <strong id="complete-selected-count">
                        0
                    </strong>

                    台を選択しました

                </p>


                <p
                    id="next-stage-message"
                    class="complete-message"
                ></p>


                <div class="complete-actions">

                    <button
                        id="back-selection-button"
                        type="button"
                        class="secondary-button large-button"
                    >
                        ← 選び直す
                    </button>


                    <button
                        id="start-next-stage-button"
                        type="button"
                        class="primary-button large-button"
                    >
                        次へ →
                    </button>

                </div>

            </div>

        </section>



        <!-- =====================================
             予選
        ====================================== -->

        <section
            id="qualifier-screen"
            class="screen hidden"
        >

            <div class="screen-top">

                <div class="stage-title-row">

                    <div>

                        <h2>
                            予選
                        </h2>

                        <p>
                            この4台から好きな2台を選択
                        </p>

                    </div>


                    <div class="qualifier-counter">

                        選択中

                        <strong id="qualifier-selected-count">
                            0
                        </strong>

                        / 2

                    </div>

                </div>


                <div class="progress">

                    <div
                        id="qualifier-progress-bar"
                        class="progress-bar"
                    ></div>

                </div>

            </div>



            <div
                id="qualifier-grid"
                class="qualifier-grid"
            ></div>



            <div class="screen-bottom qualifier-bottom">

                <div
                    id="qualifier-progress"
                    class="page-number"
                >
                    第1R 通常予選 1 / 1
                </div>


                <button
                    id="qualifier-confirm-button"
                    type="button"
                    class="primary-button qualifier-confirm"
                    disabled
                >
                    この2台で決定 →
                </button>

            </div>

        </section>



        <!-- =====================================
             順位決め
        ====================================== -->

        <section
            id="final-screen"
            class="screen hidden"
        >

            <div class="screen-top final-top">

                <div class="final-title">

                    <h2>
                        どっちが好き？
                    </h2>

                    <p>
                        好きな方をタップ
                    </p>

                </div>


                <div class="progress">

                    <div
                        id="final-progress-bar"
                        class="progress-bar"
                    ></div>

                </div>

            </div>



            <div class="final-battle">

                <button
                    id="final-car-left"
                    type="button"
                    class="final-car"
                ></button>


                <div class="vs">
                    VS
                </div>


                <button
                    id="final-car-right"
                    type="button"
                    class="final-car"
                ></button>

            </div>



            <div class="screen-bottom final-bottom">

                <div
                    id="final-progress"
                    class="page-number"
                >
                    1 / 1
                </div>

            </div>

        </section>



        <!-- =====================================
             結果
        ====================================== -->

        <section
            id="result-screen"
            class="screen hidden"
        >

            <div class="result-header">

                <h2>
                    あなたの好き車9選
                </h2>

            </div>


            <div
                id="result-grid"
                class="result-grid"
            ></div>


            <div class="result-bottom">

                <button
                    id="open-save-modal-button"
                    type="button"
                    class="primary-button result-action-button"
                >
                    SNS用に保存
                </button>


                <button
                    id="restart-button"
                    type="button"
                    class="secondary-button result-action-button"
                >
                    もう一度
                </button>

            </div>

        </section>


    </main>

</div>



<!-- =========================================
     選択中一覧
========================================== -->

<div
    id="selected-modal"
    class="modal hidden"
>

    <div class="modal-background"></div>


    <div class="modal-content">

        <button
            id="close-selected-modal"
            type="button"
            class="modal-close"
            aria-label="閉じる"
        >
            ×
        </button>


        <h2>
            選択中の車
        </h2>


        <p class="modal-count">

            <strong id="modal-selected-count">
                0
            </strong>

            台選択中

        </p>


        <div id="selected-list"></div>


        <button
            id="close-selected-modal-bottom"
            type="button"
            class="secondary-button modal-bottom-button"
        >
            閉じる
        </button>

    </div>

</div>



<!-- =========================================
     続きから
========================================== -->

<div
    id="resume-modal"
    class="modal hidden"
>

    <div class="modal-background"></div>


    <div class="modal-content resume-content">

        <h2>
            前回の続きがあります
        </h2>


        <p>
            続きから再開しますか？
        </p>


        <div class="resume-actions">

            <button
                id="new-game-button"
                type="button"
                class="secondary-button large-button"
            >
                最初から
            </button>


            <button
                id="resume-button"
                type="button"
                class="primary-button large-button"
            >
                続きから
            </button>

        </div>

    </div>

</div>



<!-- =========================================
     SNS保存
========================================== -->

<div
    id="save-result-modal"
    class="modal hidden"
>

    <div class="modal-background"></div>


    <div class="modal-content save-result-content">

        <button
            id="close-save-result-modal"
            type="button"
            class="modal-close"
            aria-label="閉じる"
        >
            ×
        </button>


        <h2>
            保存サイズ
        </h2>


        <p class="save-result-description">
            投稿先に合わせて選んでください
        </p>


        <div class="save-format-list">

            <button
                id="save-square-button"
                type="button"
                class="save-format-button"
            >

                <span class="save-format-name">
                    X・共用
                </span>

                <span class="save-format-size">
                    1:1　1080 × 1080
                </span>

            </button>


            <button
                id="save-instagram-button"
                type="button"
                class="save-format-button"
            >

                <span class="save-format-name">
                    Instagram 縦長
                </span>

                <span class="save-format-size">
                    4:5　1080 × 1350
                </span>

            </button>

        </div>


        <button
            id="cancel-save-result-button"
            type="button"
            class="secondary-button modal-bottom-button"
        >
            キャンセル
        </button>

    </div>

</div>



<script src="js/cars.js"></script>
<script src="js/app.js"></script>


</body>

</html>
